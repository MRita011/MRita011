<svg width="800" height="90" viewBox="0 0 800 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float-a { 0%,100% { transform: translate(0,0); } 50% { transform: translate(14px,-8px); } }
      @keyframes float-b { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-12px,8px); } }
      @keyframes twinkle { 0%,100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
      #fblob-1 { animation: float-a 8s ease-in-out infinite; }
      #fblob-2 { animation: float-b 10s ease-in-out infinite; }
      #fs1 { animation: twinkle 3s ease-in-out infinite; }
      #fs2 { animation: twinkle 3.6s ease-in-out infinite 0.6s; }
    </style>
    <radialGradient id="fgMint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CDEBE1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CDEBE1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fgPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7D3E0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F7D3E0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fRoundedCard">
      <rect x="1" y="1" width="798" height="88" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#fRoundedCard)">
    <rect width="800" height="90" fill="#FFF9F4"/>
    <ellipse id="fblob-1" cx="150" cy="45" rx="160" ry="70" fill="url(#fgPink)"/>
    <ellipse id="fblob-2" cx="650" cy="45" rx="160" ry="70" fill="url(#fgMint)"/>
    <circle id="fs1" cx="380" cy="30" r="2.5" fill="#E8A0BF"/>
    <circle id="fs2" cx="420" cy="60" r="2.5" fill="#B892C1"/>
    <text x="400" y="52" text-anchor="middle" font-size="18" fill="#8A7F94">⋆｡°✩ thanks for stopping by ✩°｡⋆</text>
  </g>
  <rect x="1" y="1" width="798" height="88" rx="22" fill="none" stroke="#F0DCE6" stroke-width="1.5"/>
</svg>
